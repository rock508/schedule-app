<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カレンダー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="homeScreen" class="home-screen">
      <div class="home-account-buttons">
        <button type="button">ログイン</button>
        <button type="button">ログアウト</button>
      </div>
      <button class="settings-button" type="button">設定</button>
      <div class="home-actions">
        <button id="startScheduleButton" type="button">スケジュール開始</button>
        <button id="guestPlayButton" type="button">ゲストでプレイ</button>
      </div>
    </main>

    <main id="calendarScreen" class="app" hidden>
      <header class="header">
        <h1>カレンダー</h1>
        <nav class="month-nav" aria-label="月の移動">
          <button id="previousMonth" type="button" aria-label="前の月">
            ‹
          </button>
          <strong id="currentMonth"></strong>
          <button id="nextMonth" type="button" aria-label="次の月">›</button>
        </nav>
      </header>

      <section class="layout">
        <form id="eventForm" class="event-form" hidden>
          <div class="form-heading">
            <h2>予定を追加</h2>
            <button id="closeForm" type="button" aria-label="フォームを閉じる">
              ×
            </button>
          </div>
          <label>予定名<input id="eventTitle" type="text" required /></label>
          <label>日付<input id="eventDate" type="date" required /></label>
          <label>時刻<input id="eventTime" type="time" /></label>
          <button type="submit">追加</button>
        </form>

        <section class="calendar-board" aria-label="カレンダーボード">
          <img
            class="calendar-board-image"
            src="画像倉庫/カレンダーボード.png"
            alt=""
            aria-hidden="true"
          />
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
