<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カレンダー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>カレンダー</h1>
        <nav class="month-nav" aria-label="月の移動">
          <button id="previousMonth" type="button" aria-label="前の月">
            ‹
          </button>
          <strong id="currentMonth"></strong>
          <button id="nextMonth" type="button" aria-label="次の月">›</button>
        </nav>
      </header>

      <section class="layout">
        <form id="eventForm" class="event-form">
          <h2>予定を追加</h2>
          <label>予定名<input id="eventTitle" type="text" required /></label>
          <label>日付<input id="eventDate" type="date" required /></label>
          <label>時刻<input id="eventTime" type="time" /></label>
          <button type="submit">追加</button>
        </form>

        <section class="calendar" aria-label="カレンダー">
          <div class="weekdays" aria-hidden="true">
            <span>日</span><span>月</span><span>火</span><span>水</span
            ><span>木</span><span>金</span><span>土</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
