<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カレンダー</title>
    <link rel="stylesheet" href="style.css?v=boss-battle-2" />
  </head>
  <body>
    <main id="homeScreen" class="home-screen">
      <div class="home-account-buttons">
        <button id="loginButton" type="button">ログイン</button>
        <button id="logoutButton" type="button" hidden>ログアウト</button>
      </div>
      <div id="userProfile" class="user-profile" hidden>
        <img id="userPhoto" src="" alt="Googleアカウントのアイコン" />
        <span id="userName"></span>
      </div>
      <button id="settingsButton" class="settings-button" type="button">
        設定
      </button>
      <section id="settingsPanel" class="home-popup settings-panel" hidden>
        <h2>設定</h2>
        <label
          >音量<input id="volumeControl" type="range" min="0" max="100"
        /></label>
        <label
          >明るさ<input id="brightnessControl" type="range" min="50" max="100"
        /></label>
        <button id="closeSettingsButton" type="button">閉じる</button>
      </section>
      <div class="home-actions">
        <button id="startScheduleButton" type="button">スケジュール開始</button>
        <button id="guestPlayButton" type="button">ゲストでプレイ</button>
      </div>
    </main>

    <main id="calendarScreen" hidden>
      <button id="backHomeButton" class="back-home-button" type="button">
        戻る
      </button>
      <div id="statUpEffect" class="stat-up-effect" hidden aria-live="polite">
        <strong>能力アップ！</strong>
        <span>HP +1　攻撃 +1　防御 +1</span>
      </div>
      <div class="status-area">
        <button
          id="statusButton"
          class="status-button"
          type="button"
          aria-expanded="false"
        >
          ステータス
        </button>
        <button
          id="battleResetButton"
          class="battle-reset-button"
          type="button"
        >
          神の手
        </button>
        <section
          id="godModePanel"
          class="god-mode-panel"
          hidden
          aria-label="デモ・テスト用の神の手"
        >
          <h2>神の手</h2>
          <button id="advanceDayButton" type="button">翌日に移動</button>
          <button id="killBossButton" type="button">ボスをKILL</button>
          <button id="godModeResetButton" type="button">初期化</button>
          <fieldset class="god-stats-form">
            <legend>ステータス変更</legend>
            <div class="god-stat-row">
              <span>HP</span
              ><button type="button" data-status="hp" data-delta="-1">ー</button
              ><strong id="godStatHp">1</strong
              ><button type="button" data-status="hp" data-delta="1">＋</button>
            </div>
            <div class="god-stat-row">
              <span>攻撃</span
              ><button type="button" data-status="attack" data-delta="-1">
                ー</button
              ><strong id="godStatAttack">1</strong
              ><button type="button" data-status="attack" data-delta="1">
                ＋
              </button>
            </div>
            <div class="god-stat-row">
              <span>防御</span
              ><button type="button" data-status="defense" data-delta="-1">
                ー</button
              ><strong id="godStatDefense">1</strong
              ><button type="button" data-status="defense" data-delta="1">
                ＋
              </button>
            </div>
          </fieldset>
          <p id="godModeMessage" role="status"></p>
        </section>
        <section
          id="statusPanel"
          class="status-panel"
          aria-label="能力一覧"
          hidden
        >
          <h2>能力</h2>
          <dl>
            <div>
              <dt>HP</dt>
              <dd id="statHp">1</dd>
            </div>
            <div>
              <dt>攻撃</dt>
              <dd id="statAttack">1</dd>
            </div>
            <div>
              <dt>防御</dt>
              <dd id="statDefense">1</dd>
            </div>
          </dl>
        </section>
      </div>
      <div class="app">
        <header class="header">
          <nav class="month-nav" aria-label="月の移動">
            <button id="previousMonth" type="button" aria-label="前の月">
              ‹
            </button>
            <strong id="currentMonth"></strong>
            <button id="nextMonth" type="button" aria-label="次の月">›</button>
          </nav>
        </header>

        <section class="battle-panel" aria-label="ボス戦">
          <h2>ボス戦</h2>
          <div class="boss-info">
            <img
              id="bossImage"
              class="boss-image"
              src="敵キャラ/８月.png"
              alt="8月の敵キャラ"
            />
            <p>第<strong id="bossNumber">1</strong>体目のボス</p>
            <p>ボスHP: <strong id="bossHp">読み込み中...</strong></p>
            <progress id="bossHpBar" max="1000" value="1000">
              1000 / 1000
            </progress>
            <dl class="boss-stats" aria-label="ボスの能力">
              <div>
                <dt>攻撃</dt>
                <dd id="bossAttack">-</dd>
              </div>
              <div>
                <dt>防御</dt>
                <dd id="bossDefense">-</dd>
              </div>
            </dl>
          </div>
          <div class="battle-divider" aria-hidden="true"></div>
          <div class="player-info">
            <h3>自分</h3>
            <p>HP: <strong id="playerHp">読み込み中...</strong></p>
            <progress id="playerHpBar" class="hp-bar" max="1" value="1">
              1 / 1
            </progress>
          </div>
          <p id="battleMessage" role="status"></p>
          <button id="autoBattleButton" type="button" disabled>
            オートバトル
          </button>
        </section>

        <section class="layout">
          <form id="eventForm" class="event-form" hidden>
            <div class="form-heading">
              <h2>予定を追加</h2>
              <button
                id="closeForm"
                type="button"
                aria-label="フォームを閉じる"
              >
                ×
              </button>
            </div>
            <label>予定名<input id="eventTitle" type="text" required /></label>
            <label>日付<input id="eventDate" type="date" required /></label>
            <label>時刻<input id="eventTime" type="time" /></label>
            <button type="submit">追加</button>
            <button id="deleteEvent" type="button" hidden>削除</button>
            <button id="completeEvent" type="button" hidden>完了</button>
          </form>

          <section class="calendar-board" aria-label="カレンダーボード">
            <img
              class="calendar-board-image"
              src="画像倉庫/カレンダーボード.png"
              alt=""
              aria-hidden="true"
            />
            <div id="calendarGrid" class="calendar-grid"></div>
          </section>
        </section>
      </div>
    </main>
    <script type="module" src="script.js?v=boss-battle-2"></script>
  </body>
</html>
